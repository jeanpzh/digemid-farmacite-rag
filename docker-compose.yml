services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42}
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:latest}
      EMBEDDING_MODEL_DIGEST: ${EMBEDDING_MODEL_DIGEST:-85462619ee721b466c5927d109d4cb765861907d5417b9109caebc4e614679f1}
      EMBEDDING_MODEL_MANIFEST: ${EMBEDDING_MODEL_MANIFEST:-/root/.ollama/models/manifests/registry.ollama.ai/library/embeddinggemma/latest}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        rm -f /tmp/embedding-model-verified
        ollama serve &
        server_pid=$$!
        until OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1; do
          sleep 1
         done
         OLLAMA_HOST=http://127.0.0.1:11434 ollama pull "$${EMBEDDING_MODEL}"
         actual_digest=$$(sha256sum "$${EMBEDDING_MODEL_MANIFEST}" | awk '{ print $$1 }')
         [ "$${actual_digest}" = "$${EMBEDDING_MODEL_DIGEST}" ] || {
           echo "Embedding manifest digest mismatch" >&2
           exit 1
         }
         touch /tmp/embedding-model-verified
         wait "$${server_pid}"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/embedding-model-verified && OLLAMA_HOST=http://127.0.0.1:11434 ollama show \"$${EMBEDDING_MODEL}\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 120

  app:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./apps/backend/app
          target: /app/backend/app
        - action: rebuild
          path: ./apps/backend/pyproject.toml

    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/backend/data
    environment:
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - CHAT_PROVIDER=${CHAT_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-qwen/qwen3.6-27b}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-digemid-rag}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-768}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embeddinggemma:latest}
      - VECTOR_COLLECTION=${VECTOR_COLLECTION:-digemid}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - OLLAMA_BASE_URL=http://ollama:11434

  indexer:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    profiles: ["indexing"]
    command: ["python", "-m", "app.scripts.index_to_rag"]
    volumes:
      - app-data:/app/backend/data
    environment:
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - CHAT_PROVIDER=${CHAT_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-qwen/qwen3.6-27b}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-digemid-rag}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-768}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embeddinggemma:latest}
      - VECTOR_COLLECTION=${VECTOR_COLLECTION:-digemid}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - OLLAMA_BASE_URL=http://ollama:11434

volumes:
  app-data:
    driver: local
  ollama-models:
    driver: local

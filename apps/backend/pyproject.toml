[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "jeanpzh", email = "jeanpier.jeanjelo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-groq>=1.1.3",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.1",
    "langchain-postgres>=0.0.16",
    "langchain-text-splitters==1.1.1",
    "langsmith>=0.10.16",
    "psycopg[binary,pool]>=3.2.0",
    "pypdf>=6.0.0",
    "python-dotenv>=1.2.2",
    "scrapy>=2.17.0",
    "sqlalchemy>=2.0.0",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.1",
    "slowapi>=0.1.10",
]

[project.scripts]
backend = "app.scripts.index_to_rag:main"
ingest-digemid = "app.scripts.ingest_digemid:main"
reindex-embeddings = "app.scripts.reindex_embeddings:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.build-backend]
module-name = "app"
module-root = ""
